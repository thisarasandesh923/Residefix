services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: residefix-backend:latest
    build: ./residefix-server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/residefix
      PORT: "5000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before running}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: residefix-frontend:latest
    build: ./residefix-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
